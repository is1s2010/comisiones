<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comisiones</title>
    <link rel="stylesheet" href="ventas.css">
    <script src="utilitarios.js"></script>
    <script src="ventas.js"></script>
</head>
<body>

    <div class="contenedor">
        <h1>Calculadora de Comisiones</h1>

        <label>Salario Base:</label>
        <input type="text" id="txtSueldoBase" onblur="validarInput('txtSueldoBase', 'errSueldoBase')">
        <div id="errSueldoBase" style="color: red; font-style: italic; font-size: 14px; margin-bottom: 10px;"></div>

        <label>Número de ventas:</label>
        <input type="text" id="txtVentas" onblur="validarInput('txtVentas', 'errVentas')">
        <div id="errVentas" style="color: red; font-style: italic; font-size: 14px; margin-bottom: 10px;"></div>

        <label>Precio del producto:</label>
        <input type="text" id="txtPrecio" onblur="validarInput('txtPrecio', 'errPrecio')">
        <div id="errPrecio" style="color: red; font-style: italic; font-size: 14px; margin-bottom: 10px;"></div>

        <button onclick="calcular();">Calcular Comisión</button>

        <h2>Resultados</h2>
        <p>Salario Base: <span id="spSueldoBase"></span></p>
        <p>Comisión: <span id="spComision"></span></p>
        <p>Total: <span id="spTotal"></span></p>
    </div>

</body>
</html>
